<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Weight-Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Emojis -->
    <div class="bg-emojis">
        <span class="emoji e1">📈</span>
        <span class="emoji e2">💪</span>
        <span class="emoji e3">🔥</span>
        <span class="emoji e4">⚖️</span>
        <span class="emoji e5">🥗</span>
    </div>

    <div class="dashboard-wrapper">
        <header class="dashboard-header">
            <h2>My Progress</h2>
            <a href="index.html" class="logout-link">Logout</a>
        </header>

        <div class="dashboard-content">
            <!-- Left Side: Input Form -->
            <div class="glass-card">
                <h3>Log Weight</h3>
                <form id="weight-form">
                    <div class="input-group">
                        <label for="weight">Weight (kg)</label>
                        <input type="number" id="weight" step="0.1" placeholder="e.g. 75.5" required>
                    </div>
                    <button type="submit" class="btn">Save Entry</button>
                </form>
            </div>

            <!-- Right Side: History List -->
            <div class="glass-card">
                <h3>Recent History</h3>
                <ul id="weight-history" class="weight-list">
                    <!-- JavaScript will add entries here -->
                    <li class="empty-msg">No weights logged yet.</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
