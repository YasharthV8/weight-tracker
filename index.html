<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight-Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Static Background Emojis -->
    <div class="bg-emojis">
        <span class="emoji e1">🏋️</span>
        <span class="emoji e2">💪</span>
        <span class="emoji e3">🔥</span>
        <span class="emoji e4">⚖️</span>
        <span class="emoji e5">🏃</span>
        <span class="emoji e6">🏋️‍♀️</span>
        <span class="emoji e7">💪</span>
    </div>

    <!-- Centered Login Card with Logo on Left -->
    <div class="login-container">
        <!-- Left Side: Logo -->
        <div class="login-left">
            <!-- Replace 'logo.png' with your actual logo file -->
             <span class="brand-name">Weight-Tracker</span>
            <img src="weight.png" alt="Brand Logo" class="brand-logo">
        </div>

        <!-- Right Side: Login Options -->
        <div class="login-right">
            <h2>Welcome Back</h2>
            <form action="#">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p class="signup-link">Don't have an account? <a href="#">Sign up here</a></p>
        </div>
    </div>
</body>
</html>
